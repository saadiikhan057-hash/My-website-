<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bestie ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(-45deg,#ff5f9e,#ff7eb3,#ffc3a0,#ffd5ec);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
min-height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:min(95%,850px);
background:rgba(255,255,255,.95);
padding:25px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 35px rgba(0,0,0,.2);
z-index:2;
}

h1{
color:#ff2d75;
margin-bottom:15px;
}

#content{
font-size:19px;
line-height:2;
min-height:150px;
}

button{
border:none;
background:#ff2d75;
color:white;
padding:14px 25px;
border-radius:50px;
font-size:17px;
cursor:pointer;
margin-top:15px;
}

button:hover{
transform:scale(1.05);
}

.float{
position:fixed;
pointer-events:none;
animation:up linear forwards;
}

@keyframes up{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

.final{
font-size:32px;
font-weight:bold;
color:#ff006e;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.1);
}
}
</style>
</head>
<body>

<div class="card">

<h1 id="title">❤️ My Bestie ❤️</h1>

<div id="content">
میرے دل کی سب سے خاص انسان کے لیے ✨💖
</div>

<button id="btn" onclick="nextStep()">
💋 میری جان
</button>

</div>

<script>

const data = [

{
btn:"🫂 میرا سکون",
title:"💋 میری جان",
text:"تم میری جان ہو ❤️<br>تمہارے بغیر سب ادھورا لگتا ہے 🥺🫀<br>تم میری سب سے قیمتی خوشی ہو ✨"
},

{
btn:"🌍 میری فیملی",
title:"🫂 میرا سکون",
text:"میــــرا سُکــــون bestie 🫂🥺<br>تمہاری ہنسی سے میرا دن بن جاتا ہے ♥️<br>تم میری طاقت ہو ✨"
},

{
btn:"🤍 میری دنیا",
title:"🌍 میری فیملی",
text:"تم میری جان ہو، میری فیملی ہو 💋♥️<br>تمہارے ساتھ ہر بات خاص لگتی ہے 🌍🫶"
},

{
btn:"❤️ میری Bestie",
title:"🤍 میری دنیا",
text:"اللہ تمہیں ہمیشہ خوش رکھے 🤍🥹<br>تم ہو تو دنیا حسین ہے ✨🫂"
},

{
btn:"🎉 Final Surprise",
title:"❤️ میری Bestie",
text:"➺ I Love You My Bestie ❤️<br><br>You Are My Peace 🥺♥️"
}

];

let index = 0;

function nextStep(){

if(index < data.length){

document.getElementById("title").innerHTML =
data[index].title;

document.getElementById("content").innerHTML =
data[index].text;

document.getElementById("btn").innerHTML =
data[index].btn;

index++;

}else{

document.getElementById("title").innerHTML =
"💖 FINAL SURPRISE 💖";

document.getElementById("content").innerHTML =
`
<div class="final">
💋💋💋💋💋💋💋💋💋💋<br>
I LOVE YOU MY BESTIE ❤️<br>
💋💋💋💋💋💋💋💋💋💋
</div>
`;

document.getElementById("btn").style.display="none";

startKissRain();
}

}

function floating(){

const icons=["❤️","⭐","✨","💖"];

const el=document.createElement("div");

el.className="float";
el.innerHTML=
icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*100+"vw";
el.style.bottom="-30px";
el.style.fontSize=(18+Math.random()*25)+"px";
el.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(el);

setTimeout(()=>{
el.remove();
},8000);

}

setInterval(floating,250);

function startKissRain(){

setInterval(()=>{

for(let i=0;i<10;i++){

const kiss=document.createElement("div");

kiss.className="float";
kiss.innerHTML="💋";

kiss.style.left=Math.random()*100+"vw";
kiss.style.bottom="-20px";
kiss.style.fontSize=(25+Math.random()*35)+"px";
kiss.style.animationDuration="4s";

document.body.appendChild(kiss);

setTimeout(()=>{
kiss.remove();
},5000);

}

},300);

}

</script>

</body>
</html>
